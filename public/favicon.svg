<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="innerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="32" cy="32" r="28" fill="url(#glowPulse)" />

  <!-- Outer rounded square border with gradient -->
  <rect x="5" y="5" width="54" height="54" rx="16" ry="16" fill="url(#innerBg)" stroke="url(#glowBorder)" stroke-width="3" />

  <!-- Headphones Icon (Exact Lucide Headphones path geometry with cyan glow) -->
  <g filter="url(#neon)" stroke="#22d3ee" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Headband -->
    <path d="M19 33v-5a13 13 0 0 1 26 0v5" />
    <!-- Left ear cup -->
    <rect x="15" y="33" width="8" height="13" rx="3.5" fill="#090d16" />
    <!-- Right ear cup -->
    <rect x="41" y="33" width="8" height="13" rx="3.5" fill="#090d16" />
  </g>
</svg>
